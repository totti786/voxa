name: Deploy Voxa

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (root)
        run: npm ci

      - name: Install dependencies (web)
        run: npm ci --prefix web

      - name: Install dependencies (server)
        run: npm ci --prefix server

      - name: Run typecheck (web)
        run: npm run typecheck --prefix web

      - name: Run typecheck (server)
        run: npm run typecheck --prefix server

      - name: Run tests (web)
        run: npm test --prefix web

      - name: Run tests (server)
        run: npm test --prefix server

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/voxa-web:latest

      - name: Build and push SFU image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/voxa-server:latest

      - name: Trigger VPS webhook
        env:
          VPS_WEBHOOK_URL: ${{ secrets.VPS_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: |
          curl -fsS -X POST "${VPS_WEBHOOK_URL}/voxa" \
            -H "X-Webhook-Token: ${WEBHOOK_TOKEN}"
