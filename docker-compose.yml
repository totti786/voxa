name: voxa

services:
  voxa-web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - voxa-sfu
    restart: unless-stopped

  voxa-sfu:
    build: ./server
    ports:
      - "7880:7880/tcp"
      - "10000-10100:10000-10100/udp"
    environment:
      - PORT=7880
      - RTC_MIN_PORT=10000
      - RTC_MAX_PORT=10100
      - RTC_ANNOUNCED_IP=${RTC_ANNOUNCED_IP:-}
      - LOG_LEVEL=info
    restart: unless-stopped
