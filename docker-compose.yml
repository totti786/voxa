services:
  voice-web:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - voice-sfu

  voice-sfu:
    build: ./server
    ports:
      - "7880:7880/tcp"
      - "10000-10100:10000-10100/udp"
    environment:
      - PORT=7880
      - RTC_MIN_PORT=10000
      - RTC_MAX_PORT=10100
      - LOG_LEVEL=info
